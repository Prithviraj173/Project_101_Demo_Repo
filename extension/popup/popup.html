<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Codeforces to GitHub Sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="logo">⚡</div>
      <div>
        <h3>CF to GitHub Sync</h3>
        <p class="sub">Extension Settings</p>
      </div>
    </header>

    <div class="form">
      <div class="field">
        <label for="ghToken">GitHub Personal Access Token</label>
        <input type="password" id="ghToken" placeholder="ghp_..." />
      </div>

      <div class="field">
        <label for="ghRepo">Target GitHub Repository</label>
        <input type="text" id="ghRepo" placeholder="owner/repo (e.g. Prithviraj173/CP-Solutions)" />
      </div>

      <div class="row">
        <div class="field">
          <label for="ghBranch">Branch</label>
          <input type="text" id="ghBranch" value="main" />
        </div>
        <div class="field">
          <label for="ghDir">Target Folder</label>
          <input type="text" id="ghDir" value="codeforces" />
        </div>
      </div>

      <div class="field">
        <label for="organizeMode">Repository Organization Layout</label>
        <select id="organizeMode">
          <option value="ALL" selected>🌟 All Layouts (Rating + Tags + Contest + Index)</option>
          <option value="RATING">⭐ By Rating (0800, 1200, 1600...)</option>
          <option value="TAG">🏷️ By Topic Tag (DP, Greedy, Trees...)</option>
          <option value="CONTEST">🏆 By Contest ID & Name</option>
        </select>
      </div>

      <button id="saveBtn" class="btn btn-primary">Save Settings</button>
      <div id="statusAlert" class="status-alert hidden"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
